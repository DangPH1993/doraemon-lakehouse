name: Mini Lakehouse Daily Pipeline

on:
  schedule:
    - cron: "10 1,13 * * *" # 08:10 and 20:10 Asia/Ho_Chi_Minh (UTC+7)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-lakehouse-pipeline
  cancel-in-progress: false

jobs:
  collect-clean-model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ingestion, cleaning, catalog discovery and FACT refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          AI_CLASSIFICATION_BATCH_SIZE: "12"
          AI_CLASSIFICATION_RUN_LIMIT: "72"
          AI_REQUEST_TIMEOUT_SECONDS: "35"
          PIPELINE_LOOKBACK_DAYS: "14"
          PIPELINE_LOOKBACK_HOURS: "24"
          MAX_FEED_ENTRIES_PER_SOURCE: "250"
          EVENT_TOPIC_BACKFILL_BATCH_SIZE: "60"
          TOPIC_DISCOVERY_ARTICLE_LIMIT: "800"
          REQUEST_TIMEOUT_SECONDS: "25"
          TIMEZONE: Asia/Ho_Chi_Minh
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Missing GitHub secret DATABASE_URL"; exit 1; fi
          python -m app.pipeline
