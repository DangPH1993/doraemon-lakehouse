name: Mini Lakehouse Ingestion

on:
  schedule:
    - cron: "17 * * * *" # Hourly; GitHub cron is evaluated in UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-lakehouse-ingestion
  cancel-in-progress: false

jobs:
  collect-clean-model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Show workflow trigger and time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule || 'manual' }}
        run: |
          echo "Workflow event: $EVENT_NAME"
          echo "Configured schedule: $SCHEDULE_EXPRESSION"
          date -u
          TZ=Asia/Ho_Chi_Minh date
      - name: Run RSS ingestion, article classification and FACT refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_LAKEHOUSE_ENABLED: ${{ vars.CLOUDFLARE_LAKEHOUSE_ENABLED }}
          CLOUDFLARE_LAKEHOUSE_READS: ${{ vars.CLOUDFLARE_LAKEHOUSE_READS }}
          CLOUDFLARE_R2_WAREHOUSE: ${{ secrets.CLOUDFLARE_R2_WAREHOUSE }}
          CLOUDFLARE_R2_CATALOG_URI: ${{ secrets.CLOUDFLARE_R2_CATALOG_URI }}
          CLOUDFLARE_R2_READ_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_TOKEN }}
          CLOUDFLARE_R2_RAW_ENABLED: ${{ vars.CLOUDFLARE_R2_RAW_ENABLED }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_RAW_BUCKET: ${{ secrets.CLOUDFLARE_R2_RAW_BUCKET }}
          CLOUDFLARE_R2_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_S3_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY }}
          PYTHONUNBUFFERED: "1"
          OPENAI_MODEL: gpt-4.1-mini
          AI_CLASSIFICATION_BATCH_SIZE: "12"
          AI_CLASSIFICATION_RUN_LIMIT: "48"
          AI_CLASSIFICATION_BACKFILL_ENABLED: "false"
          AI_CLASSIFICATION_RETRY_COOLDOWN_HOURS: "6"
          AI_CLASSIFICATION_MAX_RETRIES: "3"
          AI_REQUEST_TIMEOUT_SECONDS: "35"
          PIPELINE_LOOKBACK_DAYS: "14"
          PIPELINE_LOOKBACK_HOURS: "24"
          MAX_FEED_ENTRIES_PER_SOURCE: "250"
          EVENT_TOPIC_BACKFILL_BATCH_SIZE: "60"
          TOPIC_DISCOVERY_ARTICLE_LIMIT: "800"
          REQUEST_TIMEOUT_SECONDS: "25"
          TIMEZONE: Asia/Ho_Chi_Minh
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Missing GitHub secret DATABASE_URL"; exit 1; fi
          python -m app.pipeline
